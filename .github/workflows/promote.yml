name: promote-detection

# Add the label `promote:qa` or `promote:prod` to a pull request whose title starts with the rule id
# (e.g. "DET-0007: tighten exclusions"). The workflow moves the status one step, re-runs the gate and commits
# the change to the PR branch, so promotion is reviewed like any other diff.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: startsWith(github.event.label.name, 'promote:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Promote
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABEL: ${{ github.event.label.name }}
        run: |
          ID=$(echo "$TITLE" | grep -oE '^(DET|HUNT)-[0-9]{4}') || { echo "PR title must start with the rule id"; exit 1; }
          python tools/promote.py "$ID" "${LABEL#promote:}"
          python tools/validate.py
      - name: Commit
        run: |
          git config user.name "detection-ci"; git config user.email "ci@users.noreply.github.com"
          git add detections hunts && git commit -m "promote: ${{ github.event.label.name }}" && git push
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: context.payload.label.name });
